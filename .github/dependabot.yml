# Dependabot proposes updates; .github/workflows/auto-update.yml merges the
# small ones once every test passes. Major versions arrive as separate pull
# requests and wait for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript up to 6.0 (peer range <6.1.0),
      # so TypeScript 7 cannot even install yet. Remove this once a
      # typescript-eslint release accepts TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

# Every push and pull request: lint, types, unit tests, database tests and
# browser tests. On the default branch, it then migrates the Supabase database
# (when connected) and deploys to GitHub Pages.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database schema and security policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations and run policy tests
        run: bash supabase/tests/run.sh

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  migrate:
    name: Migrate Supabase
    needs: [verify, database, e2e]
    # Also on "Run workflow", so new settings can be applied without a code change.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Supabase → Connect → "Session pooler" connection string, with the
      # database password filled in. (The direct address is IPv6-only, which
      # GitHub's runners cannot reach.)
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        if: env.SUPABASE_DB_URL != ''
      - name: Apply new migrations
        if: env.SUPABASE_DB_URL != ''
        # Applies only migrations the database has not seen; a no-op otherwise.
        run: npx --yes supabase@3.2.0 db push --remote="$SUPABASE_DB_URL" --yes
      - name: Note that Supabase is not connected
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice title=Supabase not connected::Add the SUPABASE_DB_URL secret to migrate automatically. See docs/SETUP.md."

  build-site:
    name: Build site for publishing
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lets Sentry link the release to its commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # All public by design: see src/config.ts.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_ENVIRONMENT: production
          VITE_GITHUB_REPO: ${{ github.repository }}
          # Source map upload; skipped when the token is missing.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # One name per attempt, so "Re-run failed jobs" never finds two.
          name: github-pages-${{ github.run_attempt }}

  deploy:
    name: Deploy to GitHub Pages
    # A separate job, as in GitHub's own template: by the time it starts, the
    # uploaded site is registered and can be found.
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Smoke-test the live site
        run: |
          scripts/check-health.sh "${{ steps.pages.outputs.page_url }}"
          live=$(curl -fsS "${{ steps.pages.outputs.page_url }}health.json?t=$(date +%s)" | sed -n 's/.*"commit": *"\([^"]*\)".*/\1/p')
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::warning::The site still reports commit ${live:0:7}; the CDN may take a minute to update."
          fi
